name: Build GamoraVet Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build test APK and AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.0-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test AAB
        uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.0-test-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

  release-build:
    if: ${{ secrets.GAMORAVET_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMORAVET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamoravet-upload.jks"

      - name: Build signed release AAB
        env:
          GAMORAVET_KEYSTORE_PATH: ${{ runner.temp }}/gamoravet-upload.jks
          GAMORAVET_KEYSTORE_PASSWORD: ${{ secrets.GAMORAVET_KEYSTORE_PASSWORD }}
          GAMORAVET_KEY_ALIAS: ${{ secrets.GAMORAVET_KEY_ALIAS }}
          GAMORAVET_KEY_PASSWORD: ${{ secrets.GAMORAVET_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.0-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
