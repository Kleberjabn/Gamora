name: Build GamoraVet Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore official Gamora artwork
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/assets/gamora-official.jpg.b64 > app/src/main/assets/gamora-official.jpg
          sed -i 's/gamora-mascot\.svg/gamora-official.jpg/g' app/src/main/assets/index.html
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          cp app/src/main/assets/gamora-official.jpg app/src/main/res/drawable/gamora_official.jpg
          cp app/src/main/assets/gamora-official.jpg app/src/main/res/mipmap-hdpi/ic_launcher.jpg

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.GAMORAVET_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GAMORAVET_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.GAMORAVET_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.GAMORAVET_KEY_PASSWORD }}

    steps:
      - name: Check signing
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - uses: actions/checkout@v4

      - name: Restore official Gamora artwork
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/assets/gamora-official.jpg.b64 > app/src/main/assets/gamora-official.jpg
          sed -i 's/gamora-mascot\.svg/gamora-official.jpg/g' app/src/main/assets/index.html
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          cp app/src/main/assets/gamora-official.jpg app/src/main/res/drawable/gamora_official.jpg
          cp app/src/main/assets/gamora-official.jpg app/src/main/res/mipmap-hdpi/ic_launcher.jpg

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore keystore
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/gamoravet-upload.jks"

      - name: Build release
        env:
          GAMORAVET_KEYSTORE_PATH: ${{ runner.temp }}/gamoravet-upload.jks
          GAMORAVET_KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          GAMORAVET_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          GAMORAVET_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify APK
        run: "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.7-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GamoraVet-1.0.7-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
